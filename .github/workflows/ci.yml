name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff

      - name: Lint backend
        run: ruff check backend

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investment_test
          SECRET_KEY: test-secret-key
          ADMIN_INITIAL_PASSWORD: test-admin-password
          DEMO_INITIAL_PASSWORD: test-user-password
        run: python -m pytest backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies for E2E
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # schema 漂移检查：后端 OpenAPI 变了但没重新生成提交的类型文件就红。
      # 后端依赖此时已装好（上一步为 E2E 装的），导出脚本直接可用。
      # 用 status --porcelain 而不是 diff --exit-code：后者对"文件被删后重新
      # 生成为 untracked"视而不见（PR #172 复审要求 fail-loud 覆盖该情形）。
      - name: Check generated API types are current
        working-directory: frontend
        run: |
          npm run generate:api-types
          if [ -n "$(git status --porcelain src/types/api.generated.ts)" ]; then
            echo "::error::src/types/api.generated.ts 与后端 OpenAPI 不一致，请运行 npm run generate:api-types 并提交"
            git status --porcelain src/types/api.generated.ts
            git diff src/types/api.generated.ts | head -100
            exit 1
          fi

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investment_e2e
        run: npm run test:e2e
