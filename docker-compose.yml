services:
  backend:
    build: ./backend
    container_name: investment-tracker-backend
    volumes:
      - ./backend/logs:/app/logs
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      - DEMO_INITIAL_PASSWORD=${DEMO_INITIAL_PASSWORD:?Set DEMO_INITIAL_PASSWORD in .env}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:?Set TUSHARE_TOKEN in .env}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - REQUIRE_HTTPS=${REQUIRE_HTTPS:-true}
      - PRICE_REFRESH_MAX_WORKERS=${PRICE_REFRESH_MAX_WORKERS:-4}
    restart: unless-stopped
    networks:
      - investment-network

  frontend:
    build: ./frontend
    container_name: investment-tracker-frontend
    ports:
      - "80:80"      # HTTP (redirect to HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ${SSL_CERT_FULLCHAIN:?Set SSL_CERT_FULLCHAIN in .env}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_CERT_PRIVKEY:?Set SSL_CERT_PRIVKEY in .env}:/etc/nginx/ssl/privkey.pem:ro
      # Mount log directory for auditing
      - ./logs/nginx:/var/log/nginx
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:?Set NGINX_SERVER_NAME in .env}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - investment-network

networks:
  investment-network:
    driver: bridge
