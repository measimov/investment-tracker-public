services:
  backend:
    build:
      context: ./backend
    container_name: investment-tracker-backend
    volumes:
      - ${BACKEND_LOG_DIR:-./backend/logs}:/app/logs
      # 雪球 Cookie 只读挂载——挂**目录**不挂文件：bind 一个缺失的文件路径
      # 会被 Docker 在宿主机误建成同名目录，之后放真文件都放不进去（PR #186
      # 评审实锤）。默认目录 backend/secrets 随仓库存在（.gitkeep），内容
      # gitignore；XUEQIU_COOKIE_FILE 指向容器内 /app/secrets/ 下的文件名。
      - ${XUEQIU_COOKIE_HOST_DIR:-./backend/secrets}:/app/secrets:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # 裸键透传：默认值只在 config.py 一处，compose 写 `:-168` 会变成第二个
      # 默认值来源（#128 就是这么让 LLM_REPORT_MAX_OUTPUT_TOKENS 的修复失效的）。
      - SESSION_ABSOLUTE_MAX_HOURS
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      - DEMO_INITIAL_PASSWORD=${DEMO_INITIAL_PASSWORD:?Set DEMO_INITIAL_PASSWORD in .env}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - REQUIRE_HTTPS=${REQUIRE_HTTPS:-true}
      # 后端只经 nginx 访问（8000 不对外），而 nginx 用 $$scheme **覆写**
      # X-Forwarded-Proto 而非追加，因此该头在这个拓扑里可信。不开的话后端
      # 只看到 http，require_https 会把经 HTTPS 进来的登录全部拒掉。
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - PRICE_REFRESH_MAX_WORKERS=${PRICE_REFRESH_MAX_WORKERS:-4}
      - PRICE_REFRESH_FRESHNESS_SECONDS=${PRICE_REFRESH_FRESHNESS_SECONDS:-600}
      - BACKGROUND_WORKER_ENABLED=${BACKGROUND_WORKER_ENABLED:-true}
      - BACKGROUND_JOB_RETENTION_HOURS=${BACKGROUND_JOB_RETENTION_HOURS:-168}
      - BACKGROUND_JOB_STALE_MINUTES=${BACKGROUND_JOB_STALE_MINUTES:-60}
      - BACKGROUND_JOB_POLL_SECONDS=${BACKGROUND_JOB_POLL_SECONDS:-5}
      - BACKGROUND_JOB_LEASE_SECONDS=${BACKGROUND_JOB_LEASE_SECONDS:-300}
      - BACKGROUND_JOB_MAX_ATTEMPTS=${BACKGROUND_JOB_MAX_ATTEMPTS:-3}
      - BACKGROUND_JOB_RETRY_BASE_SECONDS=${BACKGROUND_JOB_RETRY_BASE_SECONDS:-30}
      - LLM_REPORT_TIMEOUT_SECONDS=${LLM_REPORT_TIMEOUT_SECONDS:-120}
      # 裸键形式：未设置则整项不下传，由 config.py 的默认值生效；.env 里设了才覆盖。
      # 曾经写成 `${...:-8192}`，于是 config.py 把上限提到 16384 后 Docker 部署仍恒为
      # 8192，长报告继续被截断——默认值只能有一个家。
      - LLM_REPORT_MAX_OUTPUT_TOKENS
      # 港股报表科目映射的输出额度（默认 32768 在 config.py），同为裸键透传
      - STATEMENT_MAX_OUTPUT_TOKENS
      # 标的分析的输出额度（默认 32768 在 config.py），同为裸键透传
      - SECURITY_ANALYSIS_MAX_OUTPUT_TOKENS
      - TUSHARE_GLOBAL_MIN_INTERVAL_SECONDS=${TUSHARE_GLOBAL_MIN_INTERVAL_SECONDS:-0.35}
      - TUSHARE_COOLDOWN_BASE_SECONDS=${TUSHARE_COOLDOWN_BASE_SECONDS:-65}
      - TUSHARE_COOLDOWN_MAX_SECONDS=${TUSHARE_COOLDOWN_MAX_SECONDS:-900}
      - REPORT_TARGET_PLAN_TTL_HOURS=${REPORT_TARGET_PLAN_TTL_HOURS:-24}
      - SECURITY_ANALYSIS_FRESHNESS_HOURS=${SECURITY_ANALYSIS_FRESHNESS_HOURS:-24}
      - SECURITY_ANALYSIS_BATCH_PAUSE_SECONDS=${SECURITY_ANALYSIS_BATCH_PAUSE_SECONDS:-5}
      - SECURITY_ANALYSIS_BATCH_MAX_SECONDS=${SECURITY_ANALYSIS_BATCH_MAX_SECONDS:-14400}
      # 分红同步：此前完全没有透传，生产只能改 compose 文件本身才能开周期任务
      - DIVIDEND_SYNC_LOOKBACK_DAYS
      - DIVIDEND_SYNC_MATCH_WINDOW_DAYS
      - DIVIDEND_SYNC_PERIODIC_ENABLED
      # 业务时区（默认 Asia/Shanghai，见 config.py）：容器系统时区是 UTC，
      # 日期换算不能依赖它，必须由应用层显式配置
      - DISPLAY_TIMEZONE
      # 美股 EDGAR 合规要求 UA 带联系方式；不透传则容器内恒为空、恒用占位 UA
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT:-}
      # 雪球数据源：留空 = 关闭（行情与 A股 xueqiu_* 数据集显式降级）。
      # COOKIE_FILE 指容器内路径，对应上面的只读挂载。
      - XUEQIU_COOKIE_FILE=${XUEQIU_COOKIE_FILE:-}
      - XUEQIU_COOKIES=${XUEQIU_COOKIES:-}
      # 雪球采集器开关（Web 进程只用它显示状态、拦截「立即运行」；采集在下面的独立服务里跑）
      - XUEQIU_COLLECTOR_ENABLED
      - XUEQIU_COLLECTOR_CYCLE_MINUTES
      - XUEQIU_COLLECTOR_WAF_COOLDOWN_SECONDS
      - XUEQIU_COLLECTOR_HEALTH_MAX_AGE_MINUTES
      - XUEQIU_COLLECTOR_SYMBOLS_ENABLED
      - XUEQIU_COLLECTOR_SYMBOLS_RUN_AFTER
      - LLM_REPORT_API_KEY=${LLM_REPORT_API_KEY:-}
      - LLM_REPORT_BASE_URL=${LLM_REPORT_BASE_URL:-https://api.deepseek.com}
      - LLM_REPORT_MODEL=${LLM_REPORT_MODEL:-deepseek-flash}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - BUILD_SHA=${BUILD_SHA:-unknown}
      # 以下为裸键透传（未在 .env 设置则不下传，config.py 默认值生效）。此前这些旋钮
      # 只写在 .env.example 里、没进这张列表，改了对容器不生效；
      # backend/tests/test_deploy_config_sync.py 守着「Settings 字段 ⊆ 本列表」。
      # Tushare 港股行情单接口间隔 / HTTPS 数据接口地址
      - TUSHARE_HK_MIN_INTERVAL_SECONDS
      - TUSHARE_API_BASE_URL
      # 雪球：上游限速与超时、Cookie 到期告警阈值
      - XUEQIU_MIN_DELAY_SECONDS
      - XUEQIU_MAX_DELAY_SECONDS
      - XUEQIU_TIMEOUT_SECONDS
      - XUEQIU_COOKIE_WARN_DAYS
      - XUEQIU_COOKIE_CRITICAL_DAYS
      # 雪球观点摘要：近期窗口 / 回看深度 / 采集停摆预警阈值
      - XUEQIU_OPINION_RECENT_DAYS
      - XUEQIU_OPINION_LOOKBACK_DAYS
      - XUEQIU_OPINION_STALE_HOURS
      # 港交所每日行情报表周期同步
      - HKEX_DAYQUOT_SYNC_ENABLED
      - HKEX_DAYQUOT_LOOKBACK_DAYS
      - HKEX_DAYQUOT_MAX_REPORTS_PER_TICK
      # 汇率：官方中间价降级天数 / 第三方比对告警阈值
      - FX_OFFICIAL_MAX_STALE_DAYS
      - FX_CHECK_WARN_PCT
      # 无风险利率：参考利率同步开关 / 风险指标默认序列
      - REFERENCE_RATE_SYNC_ENABLED
      - RISK_FREE_SERIES
      # 标的全集周期同步
      - SECURITY_CATALOG_SYNC_ENABLED
      - SECURITY_CATALOG_SYNC_INTERVAL_HOURS
    restart: unless-stopped
    networks:
      - investment-network

  frontend:
    build: ./frontend
    container_name: investment-tracker-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"      # HTTP (redirect to HTTPS)
      - "${FRONTEND_HTTPS_PORT:-443}:443"  # HTTPS
    volumes:
      - ${SSL_CERT_FULLCHAIN:?Set SSL_CERT_FULLCHAIN in .env}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_CERT_PRIVKEY:?Set SSL_CERT_PRIVKEY in .env}:/etc/nginx/ssl/privkey.pem:ro
      # Mount log directory for auditing
      - ${NGINX_LOG_DIR:-./logs/nginx}:/var/log/nginx
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:?Set NGINX_SERVER_NAME in .env}
      # 复用发布端口作为重定向端口，单一事实来源；nginx 模板 envsubst 用
      - NGINX_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-443}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - investment-network

  # 雪球发言采集器：与 backend 同一镜像的常驻进程（manage.py xueqiu-collector），
  # 每小时一轮关注作者采集 + 每天一轮按标的采集（公告/讨论/组合调仓/热帖）。
  # 与 Web 进程分离——不占 worker 车道，重启互不影响。
  # XUEQIU_COLLECTOR_ENABLED 未设为 true 时进程只空转写心跳（healthcheck 仍健康）。
  # 变量一律裸键透传：默认值只在 config.py 一处。
  xueqiu-collector:
    build:
      context: ./backend
    container_name: investment-tracker-xueqiu-collector
    command: ["python", "manage.py", "xueqiu-collector"]
    volumes:
      # 与 backend 共用日志目录（采集器写自己的 xueqiu-collector.log 与心跳文件）
      - ${BACKEND_LOG_DIR:-./backend/logs}:/app/logs
      # 同一份雪球 Cookie（只读，挂目录不挂文件，理由见 backend 服务）
      - ${XUEQIU_COOKIE_HOST_DIR:-./backend/secrets}:/app/secrets:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      # Settings 的必填项（采集器不用，但缺了进程起不来）
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      - DEMO_INITIAL_PASSWORD=${DEMO_INITIAL_PASSWORD:?Set DEMO_INITIAL_PASSWORD in .env}
      - DISPLAY_TIMEZONE
      - XUEQIU_COOKIE_FILE=${XUEQIU_COOKIE_FILE:-}
      - XUEQIU_COOKIES=${XUEQIU_COOKIES:-}
      - XUEQIU_COOKIE_WARN_DAYS
      - XUEQIU_COOKIE_CRITICAL_DAYS
      - XUEQIU_COLLECTOR_ENABLED
      - XUEQIU_COLLECTOR_PUSH_URL
      - XUEQIU_COLLECTOR_CYCLE_MINUTES
      - XUEQIU_COLLECTOR_MIN_DELAY_SECONDS
      - XUEQIU_COLLECTOR_MAX_DELAY_SECONDS
      - XUEQIU_COLLECTOR_TIMEOUT_SECONDS
      - XUEQIU_COLLECTOR_MAX_AUTHORS_PER_RUN
      - XUEQIU_COLLECTOR_AUTHOR_GAP_MIN_SECONDS
      - XUEQIU_COLLECTOR_AUTHOR_GAP_MAX_SECONDS
      - XUEQIU_COLLECTOR_MONITOR_DAYS
      - XUEQIU_COLLECTOR_PROFILE_PAGES
      - XUEQIU_COLLECTOR_MAX_COMMENT_PAGES
      - XUEQIU_COLLECTOR_STALE_POST_DAYS
      - XUEQIU_COLLECTOR_STALE_COMMENT_PAGES
      - XUEQIU_COLLECTOR_RESCAN_COOLDOWN_HOURS
      - XUEQIU_COLLECTOR_WAF_COOLDOWN_SECONDS
      - XUEQIU_COLLECTOR_MAX_WAF_HITS
      - XUEQIU_COLLECTOR_HEALTH_MAX_AGE_MINUTES
      - XUEQIU_COLLECTOR_SYMBOLS_ENABLED
      - XUEQIU_COLLECTOR_SYMBOLS_RUN_AFTER
      - XUEQIU_COLLECTOR_SYMBOL_COUNT
      - XUEQIU_COLLECTOR_HOTS_SCOPE
      - XUEQIU_COLLECTOR_SYMBOLS_RETRY_MINUTES
      - XUEQIU_COLLECTOR_SYMBOLS_MAX_ATTEMPTS
      # 心跳文件（相对 /app；默认落在挂载的 logs/ 里），healthcheck 读它的 mtime
      - XUEQIU_COLLECTOR_HEARTBEAT_FILE
    # 覆盖镜像里的 HTTP 探活（采集器不起 uvicorn）：心跳文件 mtime 在阈值内即健康
    healthcheck:
      test: ["CMD", "python", "manage.py", "xueqiu-collector-health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    restart: unless-stopped
    networks:
      - investment-network

networks:
  investment-network:
    driver: bridge
